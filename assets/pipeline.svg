<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 210" width="1160" height="210"><rect width="1160" height="210" rx="16" fill="#fff" stroke="#e2e8f0"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">How one run works</text><rect x="20" y="62" width="160" height="110" rx="14" fill="#ea580c"/><text x="100" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">1  Settings</text><text x="100" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">CLI options or</text><text x="100" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">config file</text><line x1="184" y1="117" x2="206" y2="117" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="212" y="62" width="160" height="110" rx="14" fill="#db2777"/><text x="292" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">2  Request</text><text x="292" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">User-Agent, timeout,</text><text x="292" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">1 s delay</text><line x1="376" y1="117" x2="398" y2="117" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="404" y="62" width="160" height="110" rx="14" fill="#7c3aed"/><text x="484" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">3  Check</text><text x="484" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">retry on timeout,</text><text x="484" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">429, 5xx, bad JSON</text><line x1="568" y1="117" x2="590" y2="117" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="596" y="62" width="160" height="110" rx="14" fill="#2563eb"/><text x="676" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">4  Parse</text><text x="676" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">10 fields, fix or</text><text x="676" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">drop bad values</text><line x1="760" y1="117" x2="782" y2="117" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="788" y="62" width="160" height="110" rx="14" fill="#0d9488"/><text x="868" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">5  De-duplicate</text><text x="868" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">skip keys already</text><text x="868" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">seen or saved</text><line x1="952" y1="117" x2="974" y2="117" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="980" y="62" width="160" height="110" rx="14" fill="#16a34a"/><text x="1060" y="96" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">6  Save</text><text x="1060" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">atomic write to</text><text x="1060" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".92">.json or .csv</text><text x="24" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Steps 2 to 5 repeat page by page until the requested number of NEW records is reached or the API has no more results.</text></svg>